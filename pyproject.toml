[project]
name = "teste-tecnico-python-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.136.1",
    "greenlet>=3.5.0",
    "sqlmodel>=0.0.38",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipython>=9.12.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-vcr>=1.0.2",
    "ruff>=0.15.12",
    "taskipy>=1.14.1",
]

[tool.ruff]
line-length = 79
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.taskipy.tasks]
lint = "ruff check ."
format = "ruff format ."
fix = "ruff check . --fix"
check = "ruff check . && ruff format . --check"
